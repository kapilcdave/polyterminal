[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "polyterminal"
version = "0.2.0"
description = "A read-only Textual terminal for monitoring Kalshi and Polymarket markets."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Kapil Dave"}]
keywords = ["kalshi", "polymarket", "prediction-markets", "terminal", "textual"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "textual>=7.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
    "websockets>=14.0,<17",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = ["build>=1.2"]

[project.urls]
Homepage = "https://github.com/kapilcdave/polyterminal"
Issues = "https://github.com/kapilcdave/polyterminal/issues"

[project.scripts]
polyterminal = "unified_terminal:main"

[tool.setuptools]
py-modules = [
    "kalshi_client",
    "live_engine",
    "market_matcher",
    "polymarket_client",
    "terminal_app",
    "unified_store",
    "unified_terminal",
]
